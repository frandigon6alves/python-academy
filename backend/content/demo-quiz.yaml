- prompt:
    en: What does this program print?
    es: ¿Qué imprime este programa?
  code: |
    cheer = "go" * 3
    print(cheer + "!")
  options:
    en: ["go3!", "gogogo!", "go go go!", "An error"]
    es: ["go3!", "gogogo!", "go go go!", "Un error"]
  answer: 1
  explanation:
    en: Multiplying a string by a number repeats it, with nothing added in between.
    es: Multiplicar una cadena por un número la repite, sin añadir nada entre medias.
- prompt:
    en: What does this program print?
    es: ¿Qué imprime este programa?
  code: |
    pizza_slices = 10
    friends = 4
    print(pizza_slices // friends, pizza_slices % friends)
  options:
    en: ["2.5 0", "3 2", "2 2", "2 0.5"]
    es: ["2.5 0", "3 2", "2 2", "2 0.5"]
  answer: 2
  explanation:
    en: Floor division gives each friend 2 whole slices, and the remainder operator shows 2 slices left over.
    es: La división entera da a cada amigo 2 porciones enteras, y el operador de resto muestra que sobran 2 porciones.
- prompt:
    en: What does this program print?
    es: ¿Qué imprime este programa?
  code: |
    word = "stressed"
    print(word[::-1])
  options:
    en: ["stressed", "dessert", "desserts", "sstressed"]
    es: ["stressed", "dessert", "desserts", "sstressed"]
  answer: 2
  explanation:
    en: A slice with a step of -1 walks the string backwards, and "stressed" reversed is "desserts".
    es: Una rebanada con paso -1 recorre la cadena hacia atrás, y "stressed" al revés es "desserts".
- prompt:
    en: What does this program print?
    es: ¿Qué imprime este programa?
  code: |
    checks = [0, "", "0", [], None, " "]
    print(sum(1 for value in checks if value))
  options:
    en: ["0", "1", "6", "2"]
    es: ["0", "1", "6", "2"]
  answer: 3
  explanation:
    en: Only the non-empty strings "0" and " " are truthy. Zero, empty collections and None are falsy.
    es: Solo las cadenas no vacías "0" y " " son verdaderas. El cero, las colecciones vacías y None son falsos.
- prompt:
    en: What does this program print?
    es: ¿Qué imprime este programa?
  code: |
    team = ["Ana", "Ben"]
    backup = team
    backup.append("Cleo")
    team = team + ["Dev"]
    print(len(backup), len(team))
  options:
    en: ["3 4", "2 3", "4 4", "3 3"]
    es: ["3 4", "2 3", "4 4", "3 3"]
  answer: 0
  explanation:
    en: backup is an alias, so append changes the shared list to 3 names. Then team + [...] builds a new list of 4 and rebinds only team.
    es: backup es un alias, así que append cambia la lista compartida a 3 nombres. Después team + [...] crea una lista nueva de 4 y solo reasigna team.
